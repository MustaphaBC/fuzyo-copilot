name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Midnight UTC — live smoke only (does not gate PRs)
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov

      - name: Run pytest with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          pytest backend/tests -q
          --cov=backend/app
          --cov-report=term-missing
          --cov-fail-under=0

  frontend:
    name: Frontend (lint + build)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright chromium)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      VITE_E2E_AUTH_BYPASS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        run: npx playwright test --project=chromium

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  nightly-live:
    name: Nightly live SSE smoke
    # Isolated from PR/push gates — failures never block development merges.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Start API (local staging)
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/fuzyo-api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          exit 1

      - name: Run live smoke (pytest -m live)
        env:
          PYTHONPATH: ${{ github.workspace }}
          RUN_LIVE_TESTS: "true"
          LIVE_API_BASE_URL: ${{ secrets.LIVE_API_BASE_URL }}
          LIVE_BEARER_TOKEN: ${{ secrets.LIVE_BEARER_TOKEN }}
        run: |
          export LIVE_API_BASE_URL="${LIVE_API_BASE_URL:-http://127.0.0.1:8000}"
          if [ -z "${LIVE_BEARER_TOKEN}" ]; then
            echo "LIVE_BEARER_TOKEN secret is required for nightly live smoke"
            exit 1
          fi
          pytest -m live -q --tb=short

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/fuzyo-api.pid ]; then
            kill "$(cat /tmp/fuzyo-api.pid)" || true
          fi
